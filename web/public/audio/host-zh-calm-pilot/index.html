<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主持语气试听</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; background: #161819; color: #eeeae2; font: 16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    main { max-width: 640px; margin: 40px auto; padding: 0 24px; }
    header { display: flex; align-items: center; gap: 20px; padding-bottom: 28px; }
    img { width: 60px; height: 80px; object-fit: cover; }
    h1 { font-size: 28px; margin: 0; }
    h2 { font-size: 21px; margin: 0 0 16px; }
    p { margin: 0; color: #a8b1ad; overflow-wrap: anywhere; }
    section { border-top: 1px solid #687470; padding: 24px 0; }
    audio { width: 100%; height: 54px; }
    a { display: inline-flex; align-items: center; min-height: 44px; color: #91c8ae; text-underline-offset: 5px; }
    :focus-visible { outline: 2px solid #91c8ae; outline-offset: 4px; }
    .text { border-top: 1px solid #333c3b; padding: 24px 0; }
  </style>
</head>
<body><main>
  <header><img src="/art/cardback.webp" alt="" width="60" height="80"><h1>主持语气试听</h1></header>
  <section><h2>A · 日常提醒</h2><audio controls preload="none" aria-label="A 日常提醒" src="everyday.mp3"></audio></section>
  <section><h2>B · 平直播报</h2><audio controls preload="none" aria-label="B 平直播报" src="neutral.mp3"></audio></section>
  <p class="text">天黑，请闭眼。守卫请睁眼。请选择守护目标，确认后请闭眼。</p>
  <a href="/">返回狼人杀</a>
</main></body>
</html>
